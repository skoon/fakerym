<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fakerym</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#000; font-family:"Palatino Linotype","Book Antiqua",Georgia,serif; color:#e8dcc0; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }

  #crosshair { position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px;
    border:1px solid rgba(255,255,255,.55); border-radius:50%; box-shadow:0 0 4px #000; opacity:.7; }

  /* fluid, so the three bars stay whole in a narrow window instead of being cut off at the edges */
  .bars { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); display:flex; gap:18px; align-items:flex-end;
    width:min(606px, calc(100vw - 28px)); }
  .bar { flex:1 1 0; min-width:0; height:9px; background:rgba(0,0,0,.55); border:1px solid rgba(200,180,140,.35); border-radius:5px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:100%; transition:width .12s linear; }
  #hp  > i { background:linear-gradient(90deg,#7d1b1b,#c8402f); }
  #stam> i { background:linear-gradient(90deg,#4b6320,#96c23a); }
  #mag > i { background:linear-gradient(90deg,#1d3d6e,#4b9ce0); }

  #compass { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:min(420px, calc(100vw - 24px)); height:26px;
    overflow:hidden; -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent); }
  #compass .strip { position:absolute; top:0; left:0; height:26px; white-space:nowrap; font-size:13px; letter-spacing:2px; opacity:.8; }
  #compass .tick { display:inline-block; width:60px; text-align:center; }

  #stats { position:absolute; top:14px; left:18px; font-size:14px; line-height:1.7; text-shadow:0 1px 3px #000; opacity:.9; }
  #stats b { color:#f0d896; font-weight:normal; }

  #log { position:absolute; bottom:70px; left:18px; font-size:14px; text-shadow:0 1px 3px #000; }
  #log div { opacity:0; animation:fade 4.5s forwards; }
  @keyframes fade { 8%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

  #compass .wp { position:absolute; top:17px; width:9px; height:9px; margin-left:-4.5px; border-radius:1px;
    background:#f5dd9a; transform:rotate(45deg); box-shadow:0 0 6px rgba(0,0,0,.8); display:none; }

  #objective { position:absolute; top:14px; right:18px; width:270px; text-align:right; font-size:13.5px;
    line-height:1.65; text-shadow:0 1px 3px #000; display:none; }
  #objective .olabel { font-size:10.5px; letter-spacing:2.5px; color:#c9b37a; opacity:.8; }
  #objective .otitle  { color:#f0d896; font-size:15.5px; }
  #objective .oline    { color:#ded2b6; opacity:.9; }
  #objective .ohint    { margin-top:5px; color:#f7e3a8; }

  #target { position:absolute; top:52px; left:50%; transform:translateX(-50%); text-align:center; font-size:15px;
    text-shadow:0 1px 3px #000; opacity:0; transition:opacity .2s; }
  #target .tbar { width:220px; height:5px; margin:4px auto 0; background:rgba(0,0,0,.6); border:1px solid rgba(200,180,140,.3); }
  #target .tbar > i { display:block; height:100%; background:#c8402f; }

  #damage { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 45%, rgba(150,10,10,.75) 100%);
    opacity:0; transition:opacity .35s; }

  #menu { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(20,16,10,.7), rgba(0,0,0,.94)); text-align:center; cursor:pointer; }
  #menu h1 { font-size:64px; letter-spacing:14px; font-weight:normal; color:#e6cf94; text-shadow:0 0 30px rgba(210,170,90,.35); }
  #menu p  { margin-top:22px; opacity:.75; font-size:15px; line-height:2; }
  #menu .k { color:#f0d896; }
  #menu .hint { color:#d99a72; font-size:13px; margin-top:12px; min-height:18px; }
  #menu.hidden { display:none; }

  /* A narrow window cannot hold a centred compass, a centred target readout and a right-hand
     objective panel side by side, so the two readouts drop under the compass and split the width. */
  @media (max-width: 640px) {
    #target { left:12px; right:auto; transform:none; width:42vw; text-align:left; }
    #target .tbar { width:100%; }
    #objective { top:46px; right:12px; width:min(50vw, calc(100vw - 168px)); font-size:12px; line-height:1.5; }
    #objective .otitle { font-size:14px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud">
  <div id="crosshair"></div>
  <div id="compass"><div class="strip"></div><div class="wp"></div></div>
  <div id="stats"></div>
  <div id="objective">
    <div class="olabel"></div>
    <div class="otitle"></div>
    <div class="oline"></div>
    <div class="ohint"></div>
  </div>
  <div id="target"><span class="tname"></span><div class="tbar"><i></i></div></div>
  <div id="log"></div>
  <div class="bars">
    <div class="bar" id="hp"><i></i></div>
    <div class="bar" id="stam"><i></i></div>
    <div class="bar" id="mag"><i></i></div>
  </div>
  <div id="damage"></div>
</div>

<div id="menu">
  <h1>FAKERYM</h1>
  <p>
    <span class="k">WASD</span> move &nbsp;·&nbsp; <span class="k">Shift</span> sprint &nbsp;·&nbsp; <span class="k">Space</span> jump<br>
    <span class="k">Left click</span> swing sword &nbsp;·&nbsp; <span class="k">Right click</span> cast flame<br>
    <span class="k">E</span> loot · notice board &nbsp;·&nbsp; <span class="k">T</span> pass time &nbsp;·&nbsp; <span class="k">Esc</span> release mouse<br><br>
    Work the notice board on the village street<br><br>
    click to begin
  </p>
  <p class="hint"></p>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
